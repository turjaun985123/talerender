[package]
name = "talerender"
version = "1.0.1"
edition = "2021"
description = "TaleRender — native Rust + wgpu renderer for Tall Tale Shorts (no browser, no Chrome)"
license = "MIT"

[features]
# GPUFIRST Phase 0: GPU character painting (gpupaint module,
# src/gpupaint_states.rs + TRACE harness). Off by default —
# production stays on the CPU painter until a flip decision.
gpupaint = []

[dependencies]
wgpu = "30.0.2"
pollster = "1.0.1"
image = "0.25.10"

[profile.release]
debug = false
