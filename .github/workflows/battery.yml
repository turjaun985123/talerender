name: Stroke battery (dispatch)

# The M4 stroke-battery leg, established by the Wave-2 lead as
# the standing invocation SPLIT-AMEND-W82 §5.3 requires before
# the scene.rs split steps S2/S4/S5 may start: those steps gate
# on "Battery 46/46", and until this workflow existed no CI job
# ran the battery at all (it is a binary scene mode —
# `--scene stroke-battery` -> battery::run_battery — not a
# render.yml mode, and cargo test does not cover it).
#
# The battery is the CPU painter (src/scene.rs Painter); no GPU
# is involved. Its output contract (src/battery.rs) is SEVEN
# named cards — prims.png, toon.png, face-{neutral,determined,
# angry,laugh,shock}.png — painting the M4 spec's 46 stroke
# cases between them ("46/46" names the stroke cases inside
# the cards, not a file count; the first dispatch of this leg
# failed 7/46 on exactly that misreading — the run itself was
# clean). The leg's verdict: the run completes and all seven
# cards are written. Byte-pinning the cards is deliberately
# NOT part of this leg: the founding stroke-toon pin predates
# the current 2560x2816 @ res 2 output contract, and its
# re-baseline is a separate deliberate act (the VR register
# carries stroke-toon as NOT-RENDERED debt until then).

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  battery:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install mold
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
      - name: Build
        run: cargo build --release
      - name: Run the stroke battery
        run: |
          mkdir -p "$RUNNER_TEMP/battery"
          ./target/release/talerender --scene stroke-battery \
            --out "$RUNNER_TEMP/battery/cards" \
            > "$RUNNER_TEMP/battery/battery.log" 2>&1
          cat "$RUNNER_TEMP/battery/battery.log"
      - name: Verdict (all seven cards or the leg fails)
        run: |
          grep -q "TaleRender CPU painter" "$RUNNER_TEMP/battery/battery.log"
          ok=1
          for c in prims toon face-neutral face-determined face-angry face-laugh face-shock; do
            if [ -f "$RUNNER_TEMP/battery/cards/$c.png" ]; then
              echo "card ok: $c.png"
            else
              echo "card MISSING: $c.png"; ok=0
            fi
          done
          if [ "$ok" -eq 1 ]; then
            echo "BATTERY: PASS (7/7 cards)"
          else
            echo "BATTERY: FAIL (card set incomplete)"
            exit 1
          fi
      - name: Upload battery output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: battery-${{ github.run_id }}
          path: ${{ runner.temp }}/battery
          retention-days: 7
