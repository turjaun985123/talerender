name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref — fix rounds pushed in quick
# succession don't queue behind stale runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation fights the dependency cache in CI (huge, mostly
  # unreusable artifacts). Off = smaller cache, better hit rate.
  CARGO_INCREMENTAL: 0
  # mold links the wgpu-heavy binary far faster than the default linker.
  # Kept in env so build/test/render all share one cargo fingerprint —
  # a per-step RUSTFLAGS would silently split the cache.
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  build-and-render:
    # Pinned to 22.04 (glibc 2.35) on purpose: the binary artifact is
    # downloaded and run on older dev machines (Ubuntu 24.04 / glibc
    # 2.39) for local scene iteration — a binary built on the newest
    # ubuntu-latest image demands GLIBC_2.43 and will not start there.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The cache layer: caches ~/.cargo (registry + git checkouts) and
      # target/ with keys derived from rustc version, Cargo.toml/lockfile
      # and the job — and prunes artifacts for dependencies that are no
      # longer in the tree, so the cache stays lean on its own.
      # cache-on-failure: even a failed compile round saves its cache, so
      # the next fix round starts warm instead of rebuilding wgpu cold.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # Key segment bumped when the runner image changed
          # (ubuntu-latest -> 22.04): the cross-OS restore produced
          # "can't find crate" failures for transitive deps (naga,
          # wgpu_hal, rav1e) — a stale-cache symptom, not a code error.
          key: ubuntu2204

      - name: Install mold + software Vulkan (lavapipe) for headless rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y mold mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Render the Milestone 1 smoke frame (headless, no browser)
        run: |
          # The lavapipe ICD filename varies by distro version
          # (lvp_icd.json vs lvp_icd.x86_64.json); resolve it instead
          # of hardcoding — a wrong path makes the Vulkan loader find
          # no driver at all and the render panics.
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          echo "lavapipe ICD: $ICD"
          VK_ICD_FILENAMES="$ICD" ./target/release/talerender --width 1080 --height 1920 --out frame.png
          ls -la frame.png

      - name: Upload frame artifact
        uses: actions/upload-artifact@v4
        with:
          name: talerender-frame
          path: frame.png

      # The built binary itself, so scene work (e.g. the §28 A/B
      # reproduction) can iterate locally under lavapipe instead of
      # burning a CI round per visual fix.
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: talerender-binary
          path: target/release/talerender
