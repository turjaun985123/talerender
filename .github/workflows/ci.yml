name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install software Vulkan (lavapipe) for headless rendering
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Render the Milestone 1 smoke frame (headless, no browser)
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          ./target/release/talerender --width 1080 --height 1920 --out frame.png
          ls -la frame.png

      - name: Upload frame artifact
        uses: actions/upload-artifact@v4
        with:
          name: talerender-frame
          path: frame.png
