name: Census (dispatch)

# Full-film frame-hash census on the CI lavapipe (ubuntu-22.04,
# Mesa 23.2 — the same environment as probe.yml / render.yml).
#
# Purpose: enumerate EXACTLY which frames of the Onoda film
# (1,811 frames) change across a renderer landing — the
# byte-probe protocol at whole-film scale. Used for the
# state_key sweat/tears fix (2026-11-15), whose proof requires
# a pre/post full-film hash census, not just the 40 standing
# probe frames.
#
# ⚠ NO ARTIFACTS, BY DESIGN (same law as probe.yml, from the
# 2026-11-15 artifact-storage quota incident): evidence is
# TEXT IN THE JOB LOG — sha256 of every frame, the telemetry
# verdict line, and the renderer/gpu-mem/completion lines.
# Frames are rendered in chunks and deleted after hashing, so
# disk use stays at one chunk (~250 frames).

on:
  workflow_dispatch:
    inputs:
      gpupaint:
        # GPUFIRST Batch 3 (seat FILMPATH): when true, build
        # with `--features gpupaint` and run the census renders
        # with TALERENDER_GPUPAINT=1, so the film path paints
        # characters via gpupaint (see src/paint_backend.rs for
        # the selection contract). Default false = today's
        # exact behaviour: default-features build, CPU painter,
        # no env. The baseline telemetry step is never flagged
        # (it is the standing CPU verdict in both modes); a
        # flagged dispatch ADDITIONALLY runs a flagged-telemetry
        # step (Batch 3 coordinator integration, per the user's
        # 2026-11-18 scope note superseding W84 D1 for the
        # flagged case). Dispatch twice with gpupaint=true for a
        # flagged-vs-flagged determinism pair; dispatch once
        # true + once false for the flagged-vs-unflagged
        # parity diff. Frame hashes are in the job log either
        # way (no artifacts, by design — see header).
        description: "Paint characters via gpupaint (feature build + TALERENDER_GPUPAINT=1 on census renders only)"
        type: boolean
        required: false
        default: false
      max_ram_pct:
        # GOV-CORE (GPUFIRST Batch 3): resource-governor RAM cap
        # override for this run, exported as
        # TALERENDER_MAX_RAM_PCT on the telemetry + census steps
        # when non-empty. Empty = governor defaults (60). A
        # small value (e.g. "5") is the forced-low-cap pressure
        # run: the paint cache must shrink under its byte budget
        # and still produce identical frame hashes.
        description: "Governor RAM cap % (TALERENDER_MAX_RAM_PCT); empty = default 60"
        type: string
        required: false
        default: ""
      max_gpu_pct:
        # GOV-CORE: governor GPU cap override, exported as
        # TALERENDER_MAX_GPU_PCT when non-empty. The GPU cap is
        # an APPROXIMATION (submission pacing; see
        # src/resource.rs) — this input exercises the pacing
        # path, it does not promise a utilisation %.
        description: "Governor GPU cap % (TALERENDER_MAX_GPU_PCT, pacing approximation); empty = default 60"
        type: string
        required: false
        default: ""
      max_threads:
        # GOV-CORE: governor thread cap override, exported as
        # TALERENDER_MAX_THREADS when non-empty (consumed by
        # parallel telemetry via governor().thread_cap()).
        description: "Governor thread cap (TALERENDER_MAX_THREADS); empty = default (half the cores)"
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  census:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install mold + lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mold mesa-vulkan-drivers vulkan-tools time
          ICD=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)
          echo "VK_ICD_FILENAMES=$ICD" >> "$GITHUB_ENV"
          echo "lavapipe ICD: $ICD"
      - name: Build
        env:
          GPUPAINT_INPUT: ${{ inputs.gpupaint }}
        run: |
          if [ "$GPUPAINT_INPUT" = "true" ]; then
            echo "build mode: --features gpupaint (GPUFIRST Batch 3 flagged census)"
            cargo build --release --features gpupaint
          else
            echo "build mode: default features (CPU painter census)"
            cargo build --release
          fi
          sha256sum ./target/release/talerender
          ./target/release/talerender --version
      - name: Film telemetry (verdict line is the contract)
        env:
          GOV_MAX_RAM: ${{ inputs.max_ram_pct }}
          GOV_MAX_GPU: ${{ inputs.max_gpu_pct }}
          GOV_MAX_THREADS: ${{ inputs.max_threads }}
        run: |
          # GOV-CORE: governor overrides apply only when the
          # dispatch inputs are non-empty (empty = defaults).
          if [ -n "$GOV_MAX_RAM" ]; then export TALERENDER_MAX_RAM_PCT="$GOV_MAX_RAM"; fi
          if [ -n "$GOV_MAX_GPU" ]; then export TALERENDER_MAX_GPU_PCT="$GOV_MAX_GPU"; fi
          if [ -n "$GOV_MAX_THREADS" ]; then export TALERENDER_MAX_THREADS="$GOV_MAX_THREADS"; fi
          set +e
          TALERENDER_PAINT_CACHE=24 /usr/bin/time -v ./target/release/talerender --film-telemetry film > telemetry.log 2>&1
          rc=$?
          set -e
          grep -E "^(FILM TELEMETRY|paint-cache)" telemetry.log || true
          grep -E "^governor:" telemetry.log || true
          # GOV-CORE: peak RSS in the log, greppable.
          grep -E "Maximum resident set size" telemetry.log || true
          echo "telemetry exit: $rc (0 = CHECK OK, 1 = CHECK FAILED, 3 = could not run)"
          exit $rc
      - name: Film telemetry FLAGGED (gpupaint dispatches only)
        if: ${{ inputs.gpupaint }}
        env:
          TALERENDER_GPUPAINT: "1"
          GOV_MAX_RAM: ${{ inputs.max_ram_pct }}
          GOV_MAX_GPU: ${{ inputs.max_gpu_pct }}
          GOV_MAX_THREADS: ${{ inputs.max_threads }}
        run: |
          if [ -n "$GOV_MAX_RAM" ]; then export TALERENDER_MAX_RAM_PCT="$GOV_MAX_RAM"; fi
          if [ -n "$GOV_MAX_GPU" ]; then export TALERENDER_MAX_GPU_PCT="$GOV_MAX_GPU"; fi
          if [ -n "$GOV_MAX_THREADS" ]; then export TALERENDER_MAX_THREADS="$GOV_MAX_THREADS"; fi
          set +e
          TALERENDER_PAINT_CACHE=24 /usr/bin/time -v ./target/release/talerender --film-telemetry film > telemetry-flagged.log 2>&1
          rc=$?
          set -e
          grep -E "^(FILM TELEMETRY|paint-cache)" telemetry-flagged.log || true
          grep -E "^governor:" telemetry-flagged.log || true
          grep -E "Maximum resident set size" telemetry-flagged.log || true
          echo "flagged telemetry exit: $rc (0 = CHECK OK, 1 = CHECK FAILED, 3 = could not run)"
          exit $rc
      - name: Full-film census (chunked renders, hashes to log, frames deleted)
        env:
          # "1" only for a flagged dispatch; "0" otherwise —
          # paint_backend() treats anything but exactly "1" as
          # CPU, and in an unflagged (default-features) build
          # the variable is ignored entirely. Scoped to THIS
          # step: the telemetry step above never sees it.
          TALERENDER_GPUPAINT: ${{ inputs.gpupaint && '1' || '0' }}
          GOV_MAX_RAM: ${{ inputs.max_ram_pct }}
          GOV_MAX_GPU: ${{ inputs.max_gpu_pct }}
          GOV_MAX_THREADS: ${{ inputs.max_threads }}
        run: |
          echo "census paint env: TALERENDER_GPUPAINT=$TALERENDER_GPUPAINT"
          # GOV-CORE: governor overrides, only when non-empty.
          if [ -n "$GOV_MAX_RAM" ]; then export TALERENDER_MAX_RAM_PCT="$GOV_MAX_RAM"; fi
          if [ -n "$GOV_MAX_GPU" ]; then export TALERENDER_MAX_GPU_PCT="$GOV_MAX_GPU"; fi
          if [ -n "$GOV_MAX_THREADS" ]; then export TALERENDER_MAX_THREADS="$GOV_MAX_THREADS"; fi
          echo "census governor env: TALERENDER_MAX_RAM_PCT=${TALERENDER_MAX_RAM_PCT:-<default>} TALERENDER_MAX_GPU_PCT=${TALERENDER_MAX_GPU_PCT:-<default>} TALERENDER_MAX_THREADS=${TALERENDER_MAX_THREADS:-<default>}"
          total=0
          for range in "0 250" "250 500" "500 750" "750 1000" "1000 1250" "1250 1500" "1500 1750" "1750 1811"; do
            set -- $range
            out="census-$1-$2"
            /usr/bin/time -v ./target/release/talerender --film film --out "$out" --from "$1" --to "$2" > "$out.log" 2>&1
            grep -E "^(renderer:|gpu-mem:|film render complete|paint-backend:)" "$out.log" || true
            grep -E "^governor:" "$out.log" || true
            # GOV-CORE: peak RSS per chunk, greppable in the log.
            grep -E "Maximum resident set size" "$out.log" || true
            echo "== sha256 $out =="
            sha256sum "$out"/frame_*.png
            n=$(ls "$out"/frame_*.png | wc -l)
            total=$((total + n))
            rm -rf "$out" "$out.log"
          done
          echo "CENSUS TOTAL FRAMES: $total (expected 1811)"
          test "$total" -eq 1811
