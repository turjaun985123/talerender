name: Tools CI

# The wave's Python toolchain — the data-side gates that until now
# only ran by hand on the dev VM: the film validator, the caption
# generator, the native golden pack and the bridge packager. This
# workflow runs them on every push/PR that touches the trees they
# read, so a data edit that breaks the film manifest, desyncs a
# caption strip, stales a golden pin or breaks the skill bridge
# fails here instead of surfacing at render time.
#
# Division of labour: ci.yml owns the Rust build/tests and the
# smoke render; render.yml owns dispatch renders. This workflow
# never builds Rust and never renders — tools/CI-WORKFLOW.md is
# the full contract (what each step proves, and what it refuses
# to do).

on:
  push:
    paths:
      - "tools/**"
      - "scenes/**"
      - "src/**"
      - "assets/captions/**"
      - "film/**"
      - "docs/golden/**"
      - "docs/ab/**"
      - ".github/workflows/tools-ci.yml"
  pull_request:
    paths:
      - "tools/**"
      - "scenes/**"
      - "src/**"
      - "assets/captions/**"
      - "film/**"
      - "docs/golden/**"
      - "docs/ab/**"
      - ".github/workflows/tools-ci.yml"
  workflow_dispatch:

# Cancel superseded runs on the same ref — fix rounds pushed in
# quick succession don't queue behind stale runs (same as ci.yml).
concurrency:
  group: tools-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    # Same ubuntu-22.04 pin as ci.yml/render.yml: one runner image
    # for the whole repo, so the tools behave identically wherever
    # the gates run.
    runs-on: ubuntu-22.04
    # The suite itself is seconds of CPU; the timeout only guards
    # against a hung pip install or a tool waiting on input.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned to the versions the tools are proven under on the
      # dev VM (CPython 3.12.3, Pillow 10.2.0, numpy 1.26.4). The
      # caption determinism check below is a byte comparison, so
      # the rendering stack must not drift under it.
      - name: Install pinned Python dependencies
        run: python3 -m pip install pillow==10.2.0 numpy==1.26.4

      # Exit 0 from the validator IS the 7/7 verdict: it returns 1
      # on any failed check and 2 on unreadable input, and prints
      # its full report either way.
      #
      # --no-source is deliberate, not a weakening smuggled in:
      # check 3's SOURCE LITERAL class greps the film's project
      # source tree (the manifest's `project` — an absolute path
      # on the dev VM), which is NOT in this repo. Without the
      # flag, a hosted runner greps 0 files and fails all 506
      # source-literal values for an environmental reason — the
      # first real Tools CI run (43573712817, at 381ff47) went red
      # on exactly that, 6/7, with the data blameless. With
      # --no-source those values report UNVERIFIED under a
      # COVERAGE: REDUCED line in the report (never silently
      # passed), while the exact-f32 round-trip is still enforced
      # on all 1,389 numbers and not-round-tripping values with
      # > 6 significant digits still FAIL. Full-coverage check 3
      # runs wherever the project exists (dev VM / self-hosted).
      # Same environment-gate philosophy as the caption step
      # below; tools/CI-WORKFLOW.md has the full rationale.
      - name: Film data validator (7/7)
        run: |
          echo "Validator mode: --no-source (check 3 SOURCE LITERAL class UNVERIFIED on hosted runners — the film's project tree is not in this repo; see the COVERAGE: REDUCED line in the report)"
          python3 tools/film/validate_film.py --root . --no-source

      # The generator's inputs (script.json, data/words.json,
      # data/lines.json, fonts/Inter-Black.otf) live in the film's
      # project dir, NOT in this repo — a GitHub-hosted runner has
      # nothing to regenerate from. There the step reports itself
      # UNVERIFIED with a ::warning:: (never a silent pass); where
      # the project exists (dev VM, self-hosted runner, or the
      # CAPTIONS_PROJECT repository variable set) it runs the full
      # check: regenerate into a temp dir, byte-diff against the
      # committed strips. --out is always the temp dir — the
      # generator's default writes into the repo's
      # assets/captions/, which CI must never do. If
      # CAPTIONS_PROJECT is explicitly set but wrong, that is a
      # configuration error and the step fails.
      - name: Caption strips determinism (regen + byte diff)
        env:
          CAPTIONS_PROJECT: ${{ vars.CAPTIONS_PROJECT }}
        run: |
          if [ -n "${CAPTIONS_PROJECT}" ]; then
            PROJECT="${CAPTIONS_PROJECT}"
            REQUIRED=1
          else
            PROJECT="$HOME/faceless-shorts/the-soldier-who-didnt-know"
            REQUIRED=0
          fi
          if [ ! -f "$PROJECT/data/words.json" ] || [ ! -f "$PROJECT/fonts/Inter-Black.otf" ]; then
            if [ "$REQUIRED" = "1" ]; then
              echo "::error::CAPTIONS_PROJECT is set to '$PROJECT' but the caption source project is not there (missing data/words.json or fonts/Inter-Black.otf)."
              exit 1
            fi
            echo "::warning::Caption determinism NOT verified in this run — the caption source project (script.json, data/words.json, data/lines.json, fonts/Inter-Black.otf) is not in this repo and not present at $PROJECT. The regen + byte-diff runs on machines that have the project (dev VM / self-hosted), or set the CAPTIONS_PROJECT repository variable. See tools/CI-WORKFLOW.md."
            echo "Caption determinism: SKIPPED (source project unavailable)"
            exit 0
          fi
          python3 tools/captions/gen_caption_strips.py --project "$PROJECT" --out "$RUNNER_TEMP/captions"
          diff -r "$RUNNER_TEMP/captions" assets/captions
          echo "Caption determinism: regenerated strips + manifest byte-identical to assets/captions"

      # Verify only. --pin is a deliberate human re-baseline act
      # (docs/golden/NATIVE-GOLDEN.md) and is never run in CI.
      # The tool exits 1 iff any item is STALE; MISSING — the 14
      # film mid-frames, until the film renders — does not fail.
      - name: Native golden pack verify (STALE fails; CI never pins)
        run: python3 tools/golden/make_golden.py

      # The packager exits 2 unless the project dir already exists
      # (hence the mkdir), 1 if its own verification fails, 0 only
      # when every check passes. Its output is captured so the
      # tool's own words land in the log on success AND failure.
      # The 21/21 line is asserted, not just exit 0: a future tool
      # change that silently drops a check turns this red until a
      # human re-pins the count here on purpose.
      - name: Bridge packager self-verification (21/21)
        run: |
          mkdir -p "$RUNNER_TEMP/bridge-project"
          LOG="$RUNNER_TEMP/bridge.log"
          if ! python3 tools/bridge/package_bridge.py --repo . --project "$RUNNER_TEMP/bridge-project" > "$LOG" 2>&1; then
            cat "$LOG"
            exit 1
          fi
          cat "$LOG"
          grep -F "VERIFICATION PASSED" "$LOG"
          grep -F "21/21 checks" "$LOG"

      # Scenefile-independent: every JSON under scenes/ must at
      # least parse. (The Rust loader's schema checks belong to
      # ci.yml's build; this catches truncated/corrupt data files
      # the moment they are pushed.)
      - name: Scene JSON parse sweep
        run: |
          python3 - <<'EOF'
          import glob, json, sys
          files = sorted(glob.glob("scenes/**/*.json", recursive=True))
          bad = []
          for f in files:
              try:
                  json.loads(open(f, encoding="utf-8").read())
              except Exception as e:
                  bad.append(f"{f}: {e}")
          print(f"JSON sweep: {len(files)} files under scenes/ parsed, {len(bad)} invalid")
          for b in bad:
              print("  INVALID:", b)
          sys.exit(1 if bad else 0)
          EOF

      # The light rig is data now (scene-format §14): grade keys,
      # the R3 grain-time pin, R5 preset-named atmospheres and the
      # R1 fire basis are enforced here, mechanically, instead of
      # by review. Warnings (fire basis) print but do not fail;
      # exit 1 is a failed check, 2 an input error — both fail
      # the step. No project tree needed: the atmospheres
      # vocabulary resolves relative to the tool's own path.
      - name: Light-rig validator (film scenes)
        run: python3 tools/format/check_lights.py --film scenes/film

      # The fixtures are the validator's own proof: the valid and
      # warnings-only scenes must pass, and every negative fixture
      # must fail — a validator that stops biting turns this red.
      - name: Light-rig validator (fixtures + negative controls)
        run: |
          python3 tools/format/check_lights.py \
            scenes/fixtures/lights/fx-valid.scene.json \
            scenes/fixtures/lights/fx-fire-basis-warn.scene.json
          for f in fx-grade-unknown-key fx-grade-time fx-atmosphere-inline \
                   fx-atmosphere-filmlook fx-light-negative fx-light-nan \
                   fx-light-colour-range; do
            if python3 tools/format/check_lights.py \
                 scenes/fixtures/lights/$f.scene.json; then
              echo "::error::$f unexpectedly PASSED"; exit 1
            fi
          done

      # Every asset reference in the film manifest and the driver
      # data resolves, with the right kind of bytes behind it.
      # --root is EXPLICIT: manifest references resolve against
      # it, and its default is the caller's CWD — a step that
      # relied on the default would pass or fail by accident of
      # where it ran. Portability warnings (17 at HEAD, the
      # manifest layer is root-relative by construction) and the
      # orphan report print but never change the exit code;
      # exit 1 (missing / wrong-kind / a loader silent-fallback
      # made loud) and 2 (input error) fail the step.
      - name: Asset references (film manifest + driver)
        run: python3 tools/format/check_assets.py --root . scenes/film film

      # Fixtures pin the tool's contract, including the root
      # rule itself: the cwd fixture must FAIL from a foreign
      # CWD without --root and PASS with it. Check counts are
      # mode-dependent (5/5 lone scene, 6/6 film dir), so this
      # step asserts exit codes, not a count string. The
      # valid-scene target is the scene FILE, not its directory
      # (the directory is an input error, exit 2).
      - name: Asset checker (fixtures + CWD root rule)
        run: |
          python3 tools/format/check_assets.py scenes/fixtures/assets/valid-scene/mini.scene.json
          python3 tools/format/check_assets.py scenes/fixtures/assets/valid-driver
          python3 tools/format/check_assets.py scenes/fixtures/assets/abs-path
          for t in missing wrong-kind; do
            if python3 tools/format/check_assets.py scenes/fixtures/assets/$t; then
              echo "::error::assets fixture $t unexpectedly PASSED"; exit 1
            fi
          done
          if (cd "$RUNNER_TEMP" && python3 "$GITHUB_WORKSPACE/tools/format/check_assets.py" \
                "$GITHUB_WORKSPACE/scenes/fixtures/assets/cwd/scenes/film"); then
            echo "::error::cwd fixture unexpectedly PASSED without --root"; exit 1
          fi
          python3 tools/format/check_assets.py --root scenes/fixtures/assets/cwd \
            scenes/fixtures/assets/cwd/scenes/film

      # WGSL ↔ Rust structural agreement: entry points, binding
      # numbers/kinds against the Rust bind-group layouts, and
      # hand-packed uniform sizes. Exit 1 covers FAIL and
      # UNRESOLVED alike — a refactor that changes a helper's
      # shape drops coverage loudly instead of silently. Reads
      # src/**, which is why src/** is in this workflow's trigger
      # paths. If a legitimate new helper shape appears, extend
      # the interpreter in check_shaders.py; never weaken a
      # verdict.
      - name: WGSL shader structural check
        run: python3 tools/ci/check_shaders.py --repo .

      # W42's strictness checker proves itself before it is
      # trusted with the corpus: the clean fixture exercises the
      # full loader surface and must pass with ZERO tolerated
      # occurrences (the known sets are the loader's, not the
      # corpus's habits); the allowlisted fixture passes on its
      # citations; and every planted unknown must FAIL with its
      # exact path named — a checker that stops biting turns
      # this red (same negative-control discipline as the
      # light-rig and asset fixture steps above).
      - name: Unknown-field strictness (fixtures — clean passes, planted fails named)
        run: |
          python3 tools/format/check_unknown_fields.py tools/format/fixtures/unknown_fields/fx-clean.scene.json
          python3 tools/format/check_unknown_fields.py tools/format/fixtures/unknown_fields/fx-allowlisted.scene.json
          if python3 tools/format/check_unknown_fields.py tools/format/fixtures/unknown_fields/fx-unknown.scene.json > "$RUNNER_TEMP/uf-unknown.log" 2>&1; then
            echo "::error::fx-unknown unexpectedly PASSED"; exit 1
          fi
          cat "$RUNNER_TEMP/uf-unknown.log"
          grep -F "first at $.bogus" "$RUNNER_TEMP/uf-unknown.log"
          grep -F "first at $.nodes[0].bogosity" "$RUNNER_TEMP/uf-unknown.log"
          grep -F "first at $.nodes[0].material.shininess" "$RUNNER_TEMP/uf-unknown.log"
          if python3 tools/format/check_unknown_fields.py tools/format/fixtures/unknown_fields/fx-film-data.json > "$RUNNER_TEMP/uf-film-data.log" 2>&1; then
            echo "::error::fx-film-data unexpectedly PASSED"; exit 1
          fi
          cat "$RUNNER_TEMP/uf-film-data.log"
          grep -F "first at $.studio" "$RUNNER_TEMP/uf-film-data.log"
          grep -F "first at $.captions[0].bogus" "$RUNNER_TEMP/uf-film-data.log"
          if python3 tools/format/check_unknown_fields.py tools/format/fixtures/unknown_fields/fx-manifest.json > "$RUNNER_TEMP/uf-manifest.log" 2>&1; then
            echo "::error::fx-manifest unexpectedly PASSED"; exit 1
          fi
          cat "$RUNNER_TEMP/uf-manifest.log"
          grep -F "first at $.segments[0].bogus" "$RUNNER_TEMP/uf-manifest.log"

      # Report-only + ratchet, per STRICTNESS-W42 section 7
      # Option A: the corpus legitimately carries 196 unknown-key
      # occurrences in 15 paths today (the F3-a/b/c register —
      # dead generator provenance, uncited note fields, bookshop
      # residue), so the checker itself can never go green here
      # and a hard gate would be red forever. Instead the
      # baseline (tools/format/unknown_fields_baseline.json,
      # transcribed from STRICTNESS-W42.md section 6) pins the
      # register, and this step fails only on GROWTH: a path not
      # in the baseline, or a baselined path whose occurrence
      # count increased. Shrinkage passes and prints the lowered
      # register in the baseline's own shape, so a data fix
      # lowers the baseline in the same PR. The checker's exit 2
      # (input error — e.g. a corpus file deleted or unreadable)
      # fails the step outright: a missing file is never read as
      # shrinkage. The corpus is W42's 27-file command verbatim,
      # globs unexpanded in the YAML so new scene files join the
      # corpus automatically (fixtures stay excluded — the globs
      # are single-level, scenes/fixtures/ is not matched).
      # Tolerated occurrences are reported by the checker but are
      # NOT gated: growth in the cited dialect is legal.
      - name: Unknown-field ratchet (real corpus vs baseline — growth fails)
        run: |
          LOG="$RUNNER_TEMP/unknown-fields.log"
          set +e
          python3 tools/format/check_unknown_fields.py \
            scenes/*.scene.json scenes/film/*.scene.json \
            scenes/film/film.json scenes/film/s07-calendar.json \
            scenes/sets/*.scene.json scenes/atmospheres.json \
            film/onoda.json film/assets/plates.json > "$LOG" 2>&1
          RC=$?
          set -e
          cat "$LOG"
          if [ "$RC" -eq 2 ]; then
            echo "::error::check_unknown_fields input error (exit 2) — a corpus file is missing or unreadable; the ratchet never treats that as shrinkage"
            exit 1
          fi
          python3 - "$LOG" <<'EOF'
          import json, re, sys

          log_path = sys.argv[1]
          text = open(log_path, encoding="utf-8").read()
          line_re = re.compile(
              r"^    (\S+): (\S+) \u2014 unknown key '([^']+)' in (\S+) object "
              r"\((\d+) occurrence\(s\); first at ", re.M)
          run = {}
          for f, pattern, key, ctx, n in line_re.findall(text):
              run[(f, pattern, key, ctx)] = int(n)

          base = json.load(open("tools/format/unknown_fields_baseline.json",
                                encoding="utf-8"))
          bmap = {}
          for p in base["paths"]:
              bmap[(p["file"], p["pattern"], p["key"], p["context"])] = \
                  p["occurrences"]

          failures = []
          for k in sorted(run):
              if k not in bmap:
                  failures.append(
                      "NEW unknown-key path (not in baseline): %s %s key '%s' "
                      "(%s) x%d" % (k[0], k[1], k[2], k[3], run[k]))
              elif run[k] > bmap[k]:
                  failures.append(
                      "GREW past baseline: %s %s key '%s' (%s) %d -> %d"
                      % (k[0], k[1], k[2], k[3], bmap[k], run[k]))
          total = sum(run.values())
          if total > base["totalOccurrences"]:
              failures.append("TOTAL unknown occurrences grew: %d -> %d"
                              % (base["totalOccurrences"], total))

          if failures:
              for f in failures:
                  print("::error::" + f)
              print("RATCHET: FAIL - %d growth finding(s); baseline is "
                    "tools/format/unknown_fields_baseline.json "
                    "(STRICTNESS-W42.md section 6)" % len(failures))
              sys.exit(1)

          shrunk = []
          for k in sorted(bmap):
              if k not in run:
                  shrunk.append("RESOLVED: %s %s key '%s' (%s) was x%d, now "
                                "absent" % (k[0], k[1], k[2], k[3], bmap[k]))
              elif run[k] < bmap[k]:
                  shrunk.append("DECREASED: %s %s key '%s' (%s) %d -> %d"
                                % (k[0], k[1], k[2], k[3], bmap[k], run[k]))
          for s in shrunk:
              print(s)
          print("RATCHET: PASS - %d unknown-key occurrence(s) in %d distinct "
                "path(s), baseline %d in %d; no growth"
                % (total, len(run), base["totalOccurrences"], len(bmap)))
          if shrunk:
              print("The register shrank - lower the baseline in this PR by "
                    "saving the register below over "
                    "tools/format/unknown_fields_baseline.json:")
              by_key = {}
              for p in base["paths"]:
                  by_key[(p["file"], p["pattern"], p["key"],
                          p["context"])] = p
              new = dict(base)
              new["paths"] = []
              for k in sorted(run):
                  entry = dict(by_key[k])
                  entry["occurrences"] = run[k]
                  new["paths"].append(entry)
              new["totalOccurrences"] = total
              new["distinctPaths"] = len(run)
              print(json.dumps(new, indent=2, sort_keys=True))
          EOF

      # W44's native contact-sheet tool verifies itself: the
      # suite tiles the 90 synthetic fixture frames (all committed
      # — tools/film/fixtures/sheet/frames/, covered by the
      # .gitignore fixture negations) and checks dimensions via
      # ffprobe plus tile order/identity via an ffmpeg rawvideo
      # decode; its negative cases are inside the suite (a sampled
      # frame removed must fail BY NAME with no sheet left; ffmpeg
      # absent must exit 2). Exit 0 from run_tests.py IS the
      # 10/10 verdict. Needs ffmpeg + ffprobe on the runner (the
      # ubuntu-22.04 hosted image ships both; if a future image
      # drops them this step fails loudly inside case A/D, never
      # silently). ~9 s on the dev VM.
      # The sheet suite drives ffmpeg/ffprobe via PATH; the
      # hosted ubuntu-22.04 image does not guarantee them (wave-2
      # tools-ci run 43625940101: every suite case exited 2,
      # ffmpeg absent). Install them for this step only — the
      # suite's own ffmpeg-absent case manipulates PATH itself
      # and is unaffected.
      - name: Install ffmpeg (sheet suite dependency)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Native contact sheet suite (10/10)
        run: python3 tools/film/fixtures/sheet/run_tests.py

      # §15 conformance (scene-format §15, folded in with this
      # step so the doc and its checker cannot drift apart): the
      # valid composite and the note-only fixture pass; every
      # planted violation fails — a checker that stops biting
      # turns this red (same discipline as the steps above).
      - name: Format §15 conformance (fixtures — valid passes, planted fails)
        run: |
          python3 tools/format/check_format15.py tools/format/fixtures/format15/valid-composite.scene.json
          python3 tools/format/check_format15.py tools/format/fixtures/format15/note-first-key-ease.scene.json
          for f in bad-guard-version bad-guard-shape bad-guard-stray-pid \
                   bad-guard-stray-cliptime bad-prefab-closed-key bad-clip-ease \
                   bad-colour-lane bad-step-channel bad-placement; do
            if python3 tools/format/check_format15.py tools/format/fixtures/format15/$f.scene.json; then
              echo "::error::$f unexpectedly PASSED"; exit 1
            fi
          done

      # §15 trivial pass over the production corpus: no real
      # scene or film-data file uses the extensions yet (§15.10),
      # so every file must validate — the day one fails, either
      # the data grew an extension (adoption step 2's business)
      # or the checker drifted from the format.
      - name: Format §15 conformance (production corpus — trivial pass)
        run: |
          python3 tools/format/check_format15.py scenes/*.scene.json scenes/film/*.scene.json film/onoda.json
